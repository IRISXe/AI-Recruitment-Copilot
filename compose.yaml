services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16
    container_name: ai_recruitment_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_recruitment_copilot
      POSTGRES_USER: ai_recruitment_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_recruitment_user -d ai_recruitment_copilot",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: